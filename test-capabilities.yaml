# TEST-CAPABILITIES configuration template
# Capability-backed contract (current orchestrator support):
# - implemented: cli-tester agent, correlation, quantum simulation
# - unsupported when enabled: bombadil, surf, api-fuzzer, prediction, self-healing, collective, chaos

version: '2.0'
name: 'CLI Smoke Suite'

targets:
  # Replace with the command or executable you want the orchestrator to validate.
  cli: './bin/myapp'

agents:
  cli:
    enabled: true
    type: cli-tester
    intensity: normal

  # Roadmap placeholders — keep disabled until the orchestrator supports them.
  web:
    enabled: false
    type: surf
    intensity: normal

  api:
    enabled: false
    type: api-fuzzer
    intensity: normal

  explorer:
    enabled: false
    type: bombadil
    intensity: aggressive

intelligence:
  self_healing: false
  prediction: false
  correlation: true
  collective: false

quantum:
  enabled: false
  branches: 100
  collapse_strategy: significance
  max_depth: 20
  timeout: 30s

chaos:
  enabled: false
