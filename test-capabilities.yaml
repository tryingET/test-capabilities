# TEST-CAPABILITIES configuration template
# Capability-backed contract (current orchestrator support):
# - implemented: bombadil + surf + cli-tester agents, correlation, quantum simulation
# - unsupported when enabled: api-fuzzer, prediction, self-healing, collective, chaos

version: '2.0'
name: 'CLI Smoke Suite'

targets:
  # Replace with the command or executable you want the orchestrator to validate.
  cli: './bin/myapp'
  # Required when enabling the surf or Bombadil web agents.
  # web: 'https://example.com'

agents:
  cli:
    enabled: true
    type: cli-tester
    intensity: normal

  # Supported Surf web exploration path; enable it only when targets.web is set and
  # the surf CLI is resolvable (TEST_CAPABILITIES_SURF_BIN,
  # surf on PATH, or ~/.local/bin/surf) and `surf doctor` is OK.
  web:
    enabled: false
    type: surf
    intensity: normal

  # Unsupported roadmap placeholder — keep disabled until the orchestrator supports it.
  api:
    enabled: false
    type: api-fuzzer
    intensity: normal

  # Supported web exploration path; enable it only when targets.web is set and Bombadil is resolvable.
  explorer:
    enabled: false
    type: bombadil
    intensity: aggressive

intelligence:
  self_healing: false
  prediction: false
  correlation: true
  collective: false

quantum:
  enabled: false
  branches: 100
  collapse_strategy: significance
  max_depth: 20
  timeout: 30s

chaos:
  enabled: false
