name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run"
        required: true
        type: choice
        default: full
        options:
          - full
          - deep

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The coverage ratchet diffs changed src lines against COVERAGE_BASE
          # (else HEAD^), so the history must be present.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Install dependencies
        run: npm install

      - name: Run smoke lane
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run release:check

  full:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The coverage ratchet diffs changed src lines against COVERAGE_BASE
          # (else HEAD^), so the history must be present.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Install dependencies
        run: npm install

      - name: Run full lane
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run release:check

  deep:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lane == 'deep') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The coverage ratchet diffs changed src lines against COVERAGE_BASE
          # (else HEAD^), so the history must be present.
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep
          fi

      - name: Install dependencies
        run: npm install

      - name: Run deep lane
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run release:check
          npm run docs:list -- --docs . --strict
