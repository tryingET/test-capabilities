name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish npm package from GitHub Release intent
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      GITHUB_RELEASE_ID: ${{ github.event.release.id }}
      COVERAGE_BASE: refs/tags/v0.3.0
      STRUCTURE_BASE: 30f1a868b6e56e6475fc399e691e9f0d5cdb760f
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official commits/v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, official commits/v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use qualified npm CLI with Trusted Publishing support
        run: npm install -g npm@12.0.2
      - name: Verify measured lane, source, history and OIDC prerequisites
        run: |
          node scripts/prepare-release-artifact.mjs preflight
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for (const name of ['GITHUB_ACTIONS', 'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN']) {
            assert.ok(process.env[name], `Missing GitHub OIDC prerequisite: ${name}`);
          }
          assert.equal(process.env.GITHUB_REPOSITORY, 'tryingET/test-capabilities');
          assert.equal(process.env.GITHUB_EVENT_NAME, 'release');
          assert.ok(!process.env.NPM_TOKEN && !process.env.NODE_AUTH_TOKEN, 'npm token auth is forbidden');
          console.log('Expected npm publisher: tryingET/test-capabilities / publish.yml / npm-publish');
          NODE
      - name: Refuse immutable or inconsistent published Release
        run: node scripts/verify-release-artifact.mjs host-check
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --ignore-scripts --no-audit --no-fund && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Validate GitHub Release intent
        env:
          GITHUB_REF_TYPE: tag
        run: npm run release:intent:check --silent
      - name: Prove and pack once, then verify exact tarball consumer
        id: prepare
        run: node scripts/prepare-release-artifact.mjs prepare --output-dir "$RUNNER_TEMP/release-artifact-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload verified tarball and digest manifest as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official commits/v4
        with:
          name: test-capabilities-${{ github.event.release.tag_name }}-npm-tarball
          path: |
            ${{ steps.prepare.outputs.artifact_path }}
            ${{ steps.prepare.outputs.manifest_path }}
          if-no-files-found: error
      - name: Publish exact verified file to npm with Trusted Publishing/OIDC
        id: publish_npm
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
          RELEASE_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
          RELEASE_ARTIFACT_SHA256: ${{ steps.prepare.outputs.artifact_sha256 }}
          MANIFEST_PATH: ${{ steps.prepare.outputs.manifest_path }}
        # Helper rechecks host state, source and pinned bytes immediately before ONE publish.
        run: node scripts/verify-release-artifact.mjs publish --manifest "$MANIFEST_PATH"
      - name: Verify public npm package
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: '0'
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_SPEC="test-capabilities@${VERSION}"
          echo "npm publish succeeded; waiting for public npm registry propagation for ${PACKAGE_SPEC}."
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "npm registry visibility attempt ${attempt}/8 for ${PACKAGE_SPEC}"
            if NPM_VIEW_OUTPUT="$(npm view "${PACKAGE_SPEC}" version 2>&1)"; then
              if [ "${NPM_VIEW_OUTPUT}" = "${VERSION}" ]; then
                echo "npm registry resolves exact version ${PACKAGE_SPEC}."
                break
              fi
              echo "npm registry returned an unexpected version for ${PACKAGE_SPEC}: ${NPM_VIEW_OUTPUT}"
            else
              echo "npm registry propagation pending for ${PACKAGE_SPEC}:"
              echo "${NPM_VIEW_OUTPUT}"
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "::error title=npm propagation pending::npm publish succeeded, but npm view ${PACKAGE_SPEC} did not resolve the exact version after bounded retries."
              exit 1
            fi
            echo "Retrying npm registry visibility after $((attempt * 15)) seconds."
            sleep $((attempt * 15))
          done
          node scripts/public-cli-contract.mjs public --package "${PACKAGE_SPEC}" --attempts 8
      - name: Attach the same verified tarball and manifest to GitHub Release
        if: ${{ !cancelled() && steps.publish_npm.outcome == 'success' }}
        env:
          RELEASE_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
          RELEASE_ARTIFACT_SHA256: ${{ steps.prepare.outputs.artifact_sha256 }}
          MANIFEST_PATH: ${{ steps.prepare.outputs.manifest_path }}
        run: node scripts/verify-release-artifact.mjs attach --manifest "$MANIFEST_PATH"
