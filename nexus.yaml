# NEXUS Configuration
# The One Config to Rule Them All
# Version 2.0

version: '2.0'
name: 'My App Testing Suite'

# ===========================================
# TARGETS
# ===========================================
targets:
  web: 'https://myapp.com'
  api: 'https://api.myapp.com'
  cli: './bin/myapp'

# ===========================================
# AGENTS
# ===========================================
agents:
  # Bombadil: Property-based web fuzzing
  explorer:
    enabled: true
    type: bombadil
    intensity: aggressive
    duration: 10m
    focus:
      - auth
      - checkout
      - search
    config:
      headless: true
      screenshots: true

  # Surf: AI-powered browser navigation
  navigator:
    enabled: true
    type: surf
    flows_dir: ./flows
    ai_validation: true
    visual_regression: true
    baseline_dir: ./baselines
    config:
      auto_screenshot: true
      network_capture: true

  # API Fuzzer: REST/GraphQL fuzzing
  api:
    enabled: true
    type: api-fuzzer
    schema: ./openapi.yaml
    mutations:
      - missing_fields
      - type_confusion
      - injection
      - overflow
      - boundary_values
    auth_test: true

  # CLI Tester: Command-line testing
  cli:
    enabled: false
    type: cli-tester
    commands_dir: ./commands
    edge_cases: true

# ===========================================
# INTELLIGENCE
# ===========================================
intelligence:
  # Self-healing tests
  self_healing: true
  healing_strategies:
    - testid_fallback
    - role_fallback
    - text_search
    - vision_ai
  healing_confidence_threshold: 0.7

  # Failure prediction
  prediction: true
  prediction_model: gradient_boost
  prediction_horizon: 24h
  prediction_confidence_threshold: 0.6

  # Cross-domain correlation
  correlation: true
  correlation_sources:
    - web
    - api
    - network
    - console

  # Collective intelligence (opt-in)
  collective: false
  collective_endpoint: https://nexus-collective.example.com

# ===========================================
# QUANTUM SIMULATION
# ===========================================
quantum:
  enabled: true
  branches: 1000
  collapse_strategy: significance
  max_depth: 20
  timeout: 300s

# ===========================================
# CHAOS ENGINEERING
# ===========================================
chaos:
  enabled: true
  experiments:
    # Network chaos
    - network.latency:
        values: [50, 200, 500, 1000]
    - network.packet_loss:
        values: [0, 0.01, 0.05, 0.1]
    - network.bandwidth:
        values: ['4g', '3g', '2g', 'offline']

    # System chaos
    - system.cpu_pressure:
        values: [0, 50, 80, 100]
    - system.memory_pressure:
        values: [0, 50, 80, 95]

    # Application chaos
    - application.response_delay:
        values: [0, 1000, 5000]
    - application.error_injection:
        values: [400, 500, 503]
    - application.partial_failure:
        values: ['db', 'cache', 'cdn', 'payment']

# ===========================================
# HEALING RULES
# ===========================================
healing:
  enabled: true
  max_attempts: 3
  auto_apply: false  # Require approval before applying fixes
  exclude_patterns:
    - '**/node_modules/**'
    - '**/*.d.ts'

# ===========================================
# REPORTING
# ===========================================
reporting:
  formats:
    - json
    - html
    - markdown
  output: ./reports
  include_artifacts:
    - screenshots
    - videos
    - traces
    - network_logs
  
  # Upload configuration
  upload:
    enabled: false
    destination: s3://my-bucket/nexus-reports
    retention: 30d

# ===========================================
# ALERTS
# ===========================================
alerts:
  enabled: true
  channels:
    - type: slack
      webhook: ${SLACK_WEBHOOK_URL}
      severity: [high, critical]
    - type: email
      recipients: [team@example.com]
      severity: [critical]
    - type: webhook
      url: https://api.example.com/alerts
      severity: [medium, high, critical]

# ===========================================
# PERFORMANCE
# ===========================================
performance:
  # Budgets
  budgets:
    tti: 3000      # Time to Interactive (ms)
    fcp: 1500      # First Contentful Paint (ms)
    lcp: 2500      # Largest Contentful Paint (ms)
    cls: 0.1       # Cumulative Layout Shift

  # Monitoring
  monitoring:
    enabled: true
    sample_rate: 0.1
    baseline_comparison: true

# ===========================================
# ACCESSIBILITY
# ===========================================
accessibility:
  enabled: true
  standards:
    - wcag2a
    - wcag2aa
  rules:
    - color-contrast
    - label
    - landmark
    - region
  exclude:
    - '**/iframe/**'

# ===========================================
# SECURITY
# ===========================================
security:
  enabled: true
  checks:
    - xss
    - sql_injection
    - csrf
    - headers
    - cookies
  severity_threshold: medium

# ===========================================
# PARALLEL EXECUTION
# ===========================================
execution:
  parallel: true
  max_workers: 4
  timeout_per_test: 60s
  retry_count: 2
  fail_fast: false

# ===========================================
# ENVIRONMENT VARIABLES
# ===========================================
env:
  TEST_USER_EMAIL: ${TEST_USER_EMAIL}
  TEST_USER_PASSWORD: ${TEST_USER_PASSWORD}
  API_KEY: ${API_KEY}
  BASE_URL: ${BASE_URL:-https://myapp.com}

# ===========================================
# HOOKS
# ===========================================
hooks:
  before_all: ./scripts/setup.sh
  after_all: ./scripts/teardown.sh
  before_test: ./scripts/reset-db.sh
  on_failure: ./scripts/capture-logs.sh
